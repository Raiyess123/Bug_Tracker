<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LWB Bug Tracker</title>
<style>
  :root{
    --bg:#f6f5f3; --card:#ffffff; --border:#e4e1db; --text:#2b2823; --muted:#7a756c;
    --accent:#8a6d3b; --accent-ink:#ffffff; --danger:#b34840; --ok:#4a7a4a;
    --tag-bg:#efe9dd; --shadow: 0 1px 3px rgba(0,0,0,0.06);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a17; --card:#252220; --border:#3a352f; --text:#eae6df; --muted:#a39c8f;
      --accent:#d4a95f; --accent-ink:#1c1a17; --tag-bg:#33302a; --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1a17; --card:#252220; --border:#3a352f; --text:#eae6df; --muted:#a39c8f;
    --accent:#d4a95f; --accent-ink:#1c1a17; --tag-bg:#33302a; --shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100%; padding:20px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:1.4rem; margin:4px 0 2px; font-weight:700;}
  .app-title{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
  .app-title h1{margin:0;}
  .lwb-logo{height:40px; width:auto; flex-shrink:0;}
  .sub{color:var(--muted); font-size:0.88rem; margin-bottom:20px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:18px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  label{display:block; font-size:0.8rem; font-weight:600; margin:12px 0 5px; color:var(--muted);}
  .label-row{display:flex; justify-content:space-between; align-items:center; margin:12px 0 5px;}
  .label-row label{margin:0;}
  .manage-panel{margin:8px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text], textarea, select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--bg); color:var(--text); font-size:0.92rem; font-family:inherit;
  }
  textarea{min-height:64px; resize:vertical;}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .tag-choices{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;}
  .tag-choice{
    padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--tag-bg);
    font-size:0.8rem; cursor:pointer; user-select:none; color:var(--text);
  }
  .tag-choice.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn{
    display:inline-block; padding:10px 18px; border-radius:8px; border:none; background:var(--accent);
    color:var(--accent-ink); font-weight:600; font-size:0.9rem; cursor:pointer; margin-top:16px;
  }
  .btn:disabled{opacity:0.5; cursor:default;}
  .btn.secondary{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.small{padding:6px 12px; font-size:0.78rem; margin-top:0;}
  .search-row{margin-bottom:14px;}
  .search-row input{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--text); font-size:0.9rem;
  }
  .filters{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px; align-items:flex-end;}
  .filter-group{display:flex; flex-direction:column; gap:3px;}
  .filter-group span{font-size:0.66rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:600;}
  .filter-group select{width:auto; flex:0 0 auto; font-size:0.82rem; padding:7px 8px;}
  .list-item{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .li-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .li-title{font-weight:700; font-size:0.98rem;}
  .li-desc{color:var(--muted); font-size:0.86rem; margin-top:4px; white-space:pre-wrap;}
  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .badge{font-size:0.72rem; padding:3px 9px; border-radius:999px; background:var(--tag-bg); color:var(--text);}
  .badge.status-developed{background:#3a6ea5; color:#fff;}
  .badge.status-checked{background:var(--ok); color:#fff;}
  .li-actions{display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0;}
  .li-actions-row{display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap;}
  .li-actions select{font-size:0.75rem; padding:5px 6px; width:auto;}
  .note-btn{position:relative;}
  .note-btn.has-note::after{
    content:''; position:absolute; top:-1px; right:-1px; width:7px; height:7px; border-radius:50%;
    background:var(--accent); border:1px solid var(--card);
  }
  .chk-label{display:flex; align-items:center; gap:3px; font-size:0.72rem; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap;}
  .chk-label input{margin:0; cursor:pointer;}
  .icon-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; padding:2px 4px;
  }
  .empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:0.88rem;}
  .meta{color:var(--muted); font-size:0.72rem; margin-top:6px;}
  .status-line{font-size:0.78rem; color:var(--muted); margin-top:-10px; margin-bottom:14px;}
  .mode-banner{
    font-size:0.78rem; padding:8px 12px; border-radius:8px; margin-bottom:10px;
    background:var(--tag-bg); color:var(--text); border:1px solid var(--border);
  }

  .view-tabs{display:flex; gap:8px; margin-bottom:10px;}

  .io-toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px;}
  .io-export-group{display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap;}
  .io-label{font-size:0.78rem; color:var(--muted); font-weight:600;}

  .pagination{display:flex; justify-content:center; align-items:center; gap:16px; margin:18px 0 6px;}
  .pagination .icon-btn{
    border:1px solid var(--border); border-radius:8px; padding:7px 14px; font-size:0.8rem; background:var(--card); color:var(--text);
  }
  .pagination .icon-btn:disabled{opacity:0.4; cursor:default;}
  .page-info{font-size:0.8rem; color:var(--muted);}

  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:8px; font-size:0.85rem;
    opacity:0; pointer-events:none; transition:opacity 0.25s, transform 0.25s; z-index:200; max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .view-tab{
    padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--card);
    color:var(--text); font-size:0.85rem; font-weight:600; cursor:pointer;
  }
  .view-tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .kanban-board{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; align-items:flex-start;}
  .kanban-col{
    flex:1 1 0; min-width:230px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:10px; box-shadow:var(--shadow);
  }
  .kanban-col-head{
    font-weight:700; font-size:0.85rem; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
  }
  .kanban-count{font-size:0.72rem; color:var(--muted); background:var(--tag-bg); padding:2px 9px; border-radius:999px;}
  .kanban-card{
    background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    margin-bottom:8px; cursor:pointer;
  }
  .kanban-card:hover{border-color:var(--accent);}
  .kanban-card.dragging{opacity:0.4;}
  .kanban-col.drag-over{border-color:var(--accent); background:var(--tag-bg);}
  .kanban-advance{margin-left:auto;}
  .kanban-card-title{font-weight:600; font-size:0.85rem; margin-bottom:7px; line-height:1.3;}
  .kanban-card-badges{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px;}
  .kanban-card-badges .badge{font-size:0.65rem; padding:2px 7px;}
  .kanban-card-actions{display:flex; gap:6px; align-items:center;}

  .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .section-head h2{font-size:0.95rem; margin:0;}
  .toggle-link{background:none; border:none; color:var(--accent); font-size:0.8rem; cursor:pointer; font-weight:600;}

  .tag-manage-list{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
  .tag-manage-item{
    display:flex; align-items:center; gap:6px; background:var(--tag-bg); border-radius:999px;
    padding:5px 6px 5px 12px; font-size:0.8rem;
  }
  .tag-manage-item .icon-btn{padding:1px 3px; font-size:0.85rem;}
  .tag-manage-item.editing{background:var(--bg); border:1px solid var(--border); padding:5px 8px 5px 8px;}
  .tag-manage-item.editing .tag-name-input{width:130px; padding:4px 6px; font-size:0.8rem;}
  .tag-manage-item.confirm{background:var(--danger); color:#fff;}
  .tag-color-swatch{
    width:20px; height:20px; padding:0; border:1px solid rgba(0,0,0,0.2); border-radius:50%;
    cursor:pointer; flex-shrink:0; display:inline-block; outline:none; -webkit-appearance:none; appearance:none;
  }
  .add-tag-row{display:flex; gap:8px; margin-top:8px;}
  .add-tag-row input{flex:1;}

  /* Color picker popover (geser, bukan dialog OS) */
  .color-popover{
    position:fixed; z-index:80; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px; box-shadow:0 6px 20px rgba(0,0,0,0.28); width:184px;
  }
  .cp-close{
    position:absolute; top:6px; right:8px; background:none; border:none; color:var(--muted);
    font-size:0.85rem; cursor:pointer; padding:2px;
  }
  .cp-sv{
    position:relative; width:100%; height:110px; border-radius:8px; margin:14px 0 12px; cursor:crosshair;
    background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent);
    background-blend-mode: multiply; touch-action:none; user-select:none;
  }
  .cp-sv-pointer{
    position:absolute; width:14px; height:14px; border-radius:50%; border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,0.45); transform:translate(-50%,-50%); pointer-events:none;
  }
  .cp-hue{
    position:relative; width:100%; height:14px; border-radius:7px; margin-bottom:12px; cursor:pointer;
    background:linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    touch-action:none; user-select:none;
  }
  .cp-hue-pointer{
    position:absolute; top:50%; width:16px; height:16px; border-radius:50%; border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,0.45); transform:translate(-50%,-50%); pointer-events:none;
  }
  .cp-hex-row input{
    width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--text); font-size:0.82rem; text-align:center; font-family:monospace;
  }

  .img-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .img-thumb{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border);}
  .img-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .img-thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.6); color:#fff; border:none;
    border-radius:50%; width:18px; height:18px; font-size:0.7rem; cursor:pointer; line-height:1;
  }
  .li-images{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .li-images img{
    width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer;
  }
  .upload-label{
    display:inline-block; padding:7px 14px; border-radius:8px; border:1px dashed var(--border);
    font-size:0.8rem; color:var(--muted); cursor:pointer; margin-top:2px;
  }
  .upload-label input{display:none;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,18,15,0.55); z-index:100;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 14px;
    padding-top:calc(24px + env(safe-area-inset-top,0px)); overflow-y:auto;
  }
  .modal-card{
    background:var(--card); border-radius:14px; max-width:600px; width:100%;
    padding:20px; box-shadow:0 8px 30px rgba(0,0,0,0.25); position:relative;
  }
  .modal-close{
    position:absolute; top:12px; right:12px; background:none; border:none; font-size:1.2rem;
    color:var(--muted); cursor:pointer; line-height:1; padding:4px;
  }
  .modal-title{font-size:1.05rem; font-weight:700; margin:0 0 14px; padding-right:24px;}
  .view-row{margin-bottom:12px;}
  .view-row .vr-label{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:600; margin-bottom:3px;}
  .view-desc{white-space:pre-wrap; font-size:0.9rem;}
  .view-gallery{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .view-gallery img{width:100px; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer;}
  .view-checklist{display:flex; gap:16px; margin-top:2px;}

  .lightbox-card{background:transparent; box-shadow:none; padding:0; max-width:90vw;}
  .lightbox-card img{max-width:90vw; max-height:85vh; display:block; margin:0 auto; border-radius:10px;}
  .lightbox-card .modal-close{
    background:rgba(20,18,15,0.6); color:#fff; border-radius:50%; top:-10px; right:-10px;
  }
</style>
</head>

// ---------- Color helpers ----------

function hsvToRgb(h, s, v){
  s /= 100; v /= 100;
  const c = v * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = v - c;
  let r=0, g=0, b=0;
  if(h < 60){ r=c; g=x; b=0; }
  else if(h < 120){ r=x; g=c; b=0; }
  else if(h < 180){ r=0; g=c; b=x; }
  else if(h < 240){ r=0; g=x; b=c; }
  else if(h < 300){ r=x; g=0; b=c; }
  else { r=c; g=0; b=x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function hsvToHex(h, s, v){
  const [r,g,b] = hsvToRgb(h, s, v);
  const toHex = n => Math.max(0,Math.min(255,n)).toString(16).padStart(2,'0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}
function hexToHsv(hex){
  hex = (hex||'#c98a3a').replace('#','');
  if(hex.length === 3){ hex = hex.split('').map(c=>c+c).join(''); }
  if(hex.length !== 6){ hex = 'c98a3a'; }
  const r = parseInt(hex.substr(0,2),16)/255, g = parseInt(hex.substr(2,2),16)/255, b = parseInt(hex.substr(4,2),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
  let h = 0;
  if(d !== 0){
    switch(max){
      case r: h = 60 * (((g-b)/d) % 6); break;
      case g: h = 60 * ((b-r)/d + 2); break;
      case b: h = 60 * ((r-g)/d + 4); break;
    }
  }
  if(h < 0) h += 360;
  const s = max === 0 ? 0 : d/max;
  return {h, s: s*100, v: max*100};
}

function contrastColor(hex){
  if(!hex) return '';
  const c = hex.replace('#','');
  if(c.length !== 6) return '';
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#201e1a' : '#ffffff';
}

function tagBadgeHtml(name){
  const t = tags.find(x=>x.name===name);
  const color = t && t.color;
  const style = color ? ` style="background:${color}; color:${contrastColor(color)};"` : '';
  return `<span class="badge"${style}>${escapeHtml(name)}</span>`;
}

function priorityBadgeHtml(name){
  const p = priorities.find(x=>x.name===name);
  const color = p && p.color;
  const style = color ? ` style="background:${color}; color:${contrastColor(color)};"` : '';
  return `<span class="badge"${style}>${escapeHtml(name||'')}</span>`;
}

function priorityOrderOf(name){
  const p = priorities.find(x=>x.name===name);
  return p ? (p.order||0) : -1;
}

function renderTagChoices(){
  const wrap = $('tag-choices');
  wrap.innerHTML = '';
  tags.forEach(t=>{
    const el = document.createElement('div');
    const active = selectedTags.has(t.name);
    el.className = 'tag-choice' + (active ? ' active' : '');
    el.dataset.tag = t.name;
    el.textContent = (active ? '✓ ' : '') + t.name;
    if(t.color){
      el.style.background = t.color;
      el.style.color = contrastColor(t.color);
      el.style.borderColor = t.color;
    }
    wrap.appendChild(el);
  });
}
$('tag-choices').addEventListener('click', (e)=>{
  const el = e.target.closest('.tag-choice');
  if(!el) return;
  const t = el.dataset.tag;
  if(selectedTags.has(t)){ selectedTags.delete(t); } else { selectedTags.add(t); }
  renderTagChoices();
});

  else if(sorted.length) $('f-priority').value = sorted[Math.min(1,sorted.length-1)].name;

}

const MANAGE_CONFIG = {
  tag:      { listEl:'tag-manage-list',      inputEl:'new-tag-input',      addBtnEl:'add-tag-btn',      hasColor:true,  collection:'tags' },
  module:   { listEl:'module-manage-list',   inputEl:'new-module-input',   addBtnEl:'add-module-btn',   hasColor:false, collection:'modules' },
  priority: { listEl:'priority-manage-list', inputEl:'new-priority-input', addBtnEl:'add-priority-btn', hasColor:true,  collection:'priorities' }
};

function arrOf(kind){ return kind==='tag' ? tags : kind==='module' ? modules : priorities; }
function setArrOf(kind, val){ if(kind==='tag') tags=val; else if(kind==='module') modules=val; else priorities=val; }
function parseKey(key){ const i = key.indexOf(':'); return {kind: key.slice(0,i), id: key.slice(i+1)}; }

let editingKey = null;
let confirmDeleteKey = null;

function afterEntityChange(kind){
  if(kind==='tag'){ renderTagChoices(); renderEdTagChoices(); renderTagFilterOptions(); }
  else if(kind==='module'){ renderModuleOptions(); }
  else if(kind==='priority'){ renderPriorityOptions(); }
  renderAllManagers();
  render();
}

function renderManager(kind){
  const cfg = MANAGE_CONFIG[kind];
  const wrap = $(cfg.listEl);
  if(!wrap) return;
  wrap.innerHTML = '';
  arrOf(kind).forEach(t=>{
    const el = document.createElement('div');
    const color = t.color || '';
    const key = kind+':'+t.id;

    if(confirmDeleteKey === key){
      el.className = 'tag-manage-item confirm';
      el.innerHTML = `<span>Hapus "${escapeHtml(t.name)}"?</span>
        <button class="icon-btn" data-confirm-del="${key}" title="Ya, hapus">✔️</button>
        <button class="icon-btn" data-cancel-del="${key}" title="Batal">✕</button>`;
    } else if(editingKey === key){
      el.className = 'tag-manage-item editing';
      el.innerHTML = `
        ${cfg.hasColor ? `<button type="button" class="tag-color-swatch" data-open-picker="${key}" style="background:${color || '#c98a3a'}" title="Pilih warna"></button>` : ''}
        <input type="text" class="tag-name-input" data-name-edit="${key}" value="${escapeHtml(t.name)}">
        <button class="icon-btn" data-save-tag="${key}" title="Simpan">✔️</button>
        <button class="icon-btn" data-cancel-edit="${key}" title="Batal">✕</button>`;
    } else {
      el.className = 'tag-manage-item';
      el.innerHTML = `
        ${cfg.hasColor ? `<button type="button" class="tag-color-swatch" data-open-picker="${key}" style="background:${color || 'var(--tag-bg)'}" title="Ubah warna"></button>` : ''}
        <span>${escapeHtml(t.name)}</span>
        <button class="icon-btn" data-rename="${key}" title="Ubah nama">✏️</button>
        <button class="icon-btn" data-remove="${key}" title="Hapus">🗑️</button>`;
    }
    wrap.appendChild(el);
  });

  wrap.querySelectorAll('[data-rename]').forEach(b=>{
    b.addEventListener('click', ()=>{ editingKey = b.dataset.rename; confirmDeleteKey = null; renderAllManagers(); });
  });
  wrap.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click', ()=>{ confirmDeleteKey = b.dataset.remove; editingKey = null; renderAllManagers(); });
  });
  wrap.querySelectorAll('[data-open-picker]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); const {kind:k,id} = parseKey(b.dataset.openPicker); openColorPopover(k, id, b); });
  });
  wrap.querySelectorAll('[data-save-tag]').forEach(b=>{
    b.addEventListener('click', ()=>saveEntityEdit(b.dataset.saveTag));
  });
  wrap.querySelectorAll('.tag-name-input').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); saveEntityEdit(inp.dataset.nameEdit); } });
  });
  wrap.querySelectorAll('[data-cancel-edit]').forEach(b=>{
    b.addEventListener('click', ()=>{ editingKey = null; renderAllManagers(); });
  });
  wrap.querySelectorAll('[data-confirm-del]').forEach(b=>{
    b.addEventListener('click', ()=>{ const key = b.dataset.confirmDel; confirmDeleteKey = null; removeEntity(key); });
  });
  wrap.querySelectorAll('[data-cancel-del]').forEach(b=>{
    b.addEventListener('click', ()=>{ confirmDeleteKey = null; renderAllManagers(); });
  });
}
function renderAllManagers(){
  renderManager('tag'); renderManager('module'); renderManager('priority');
}

async function addEntity(kind){
  const cfg = MANAGE_CONFIG[kind];
  const input = $(cfg.inputEl);
  const name = input.value.trim();
  if(!name) return;
  const arr = arrOf(kind);
  if(arr.some(t=>t.name.toLowerCase()===name.toLowerCase())){ input.value=''; return; }
  const doc = {name};
  if(cfg.hasColor){ doc.color = TAG_PALETTE[arr.length % TAG_PALETTE.length]; }
  if(kind==='priority'){ doc.order = arr.length ? Math.max(...arr.map(p=>p.order||0))+1 : 0; }
  if(dbNs){
    try{ await dbNs.collection(cfg.collection).doc().set(doc); }
    catch(err){ console.error(err); alert('Gagal menambah.'); return; }
  } else {
    setArrOf(kind, [...arr, {id:'local-'+kind+'-'+Date.now(), ...doc}]);
    afterEntityChange(kind);
  }
  input.value = '';
}

async function cascadeRename(kind, oldName, newName){
  if(kind==='tag'){
    const affected = items.filter(it=>(it.tags||[]).includes(oldName));
    for(const it of affected){
      const newTags = it.tags.map(x=>x===oldName?newName:x);
      if(dbNs){ await dbNs.doc('bugs/'+it.id).update({tags:newTags}); }
      else { it.tags = newTags; }
    }
  } else {
    const field = kind==='module' ? 'module' : 'priority';
    const affected = items.filter(it=>it[field]===oldName);
    for(const it of affected){
      if(dbNs){ await dbNs.doc('bugs/'+it.id).update({[field]:newName}); }
      else { it[field] = newName; }
    }
  }
}

async function saveEntityEdit(key){
  const {kind, id} = parseKey(key);
  const cfg = MANAGE_CONFIG[kind];
  const nameInput = document.querySelector(`[data-name-edit="${key}"]`);
  const t = arrOf(kind).find(x=>x.id===id);
  if(!t || !nameInput) return;
  const newName = nameInput.value.trim();
  if(!newName){ nameInput.focus(); return; }
  try{
    if(newName !== t.name){
      if(dbNs){ await dbNs.doc(cfg.collection+'/'+id).update({name:newName}); }
      await cascadeRename(kind, t.name, newName);
      if(!dbNs){ t.name = newName; }
    }
    editingKey = null;
    afterEntityChange(kind);
  }catch(err){ console.error(err); alert('Gagal mengubah.'); }
}

async function removeEntity(key){
  const {kind, id} = parseKey(key);
  const cfg = MANAGE_CONFIG[kind];
  const t = arrOf(kind).find(x=>x.id===id);
  if(!t) return;
  try{
    if(dbNs){
      await dbNs.doc(cfg.collection+'/'+id).delete();
      if(kind==='tag'){
        const affected = items.filter(it=>(it.tags||[]).includes(t.name));
        for(const it of affected){
          const newTags = it.tags.filter(x=>x!==t.name);
          await dbNs.doc('bugs/'+it.id).update({tags:newTags});
        }
      }
    } else {
      setArrOf(kind, arrOf(kind).filter(x=>x.id!==id));
      if(kind==='tag'){
        items.forEach(it=>{ it.tags = (it.tags||[]).filter(x=>x!==t.name); });
        selectedTags.delete(t.name); edSelectedTags.delete(t.name);
      }
    }
    afterEntityChange(kind);
  }catch(err){ console.error(err); alert('Gagal menghapus.'); }
}

async function updateEntityColor(kind, id, color){
  const cfg = MANAGE_CONFIG[kind];
  const t = arrOf(kind).find(x=>x.id===id);
  if(!t) return;
  try{
    if(dbNs){ await dbNs.doc(cfg.collection+'/'+id).update({color}); }
    else { t.color = color; afterEntityChange(kind); }
  }catch(err){ console.error(err); }
}

// ---------- Color picker popover (digeser, bukan dialog OS) ----------

let colorPopoverTargetKind = null;
let colorPopoverTargetId = null;
let cpHue = 30, cpSat = 60, cpVal = 78;

function previewColorOnSwatches(hex){
  document.querySelectorAll(`[data-open-picker="${colorPopoverTargetKind}:${colorPopoverTargetId}"]`).forEach(b=>{ b.style.background = hex; });
}

function updateColorPopoverUI(skipHexField){
  const hex = hsvToHex(cpHue, cpSat, cpVal);
  const svEl = $('cp-sv');
  svEl.style.backgroundColor = hsvToHex(cpHue, 100, 100);
  const w = svEl.clientWidth || 160, h = svEl.clientHeight || 110;
  $('cp-sv-pointer').style.left = (cpSat/100*w) + 'px';
  $('cp-sv-pointer').style.top = ((100-cpVal)/100*h) + 'px';
  const hueEl = $('cp-hue');
  const hw = hueEl.clientWidth || 160;
  $('cp-hue-pointer').style.left = (cpHue/360*hw) + 'px';
  if(!skipHexField){ $('cp-hex').value = hex.toUpperCase(); }
  if(colorPopoverTargetId){ previewColorOnSwatches(hex); }
}

function openColorPopover(kind, id, anchorEl){
  const t = arrOf(kind).find(x=>x.id===id);
  if(!t) return;
  colorPopoverTargetKind = kind;
  colorPopoverTargetId = id;
  const hsv = hexToHsv(t.color || '#c98a3a');
  cpHue = hsv.h; cpSat = hsv.s; cpVal = Math.max(hsv.v, 15);
  const pop = $('color-picker-popover');
  pop.style.display = 'block';
  requestAnimationFrame(()=>{
    const rect = anchorEl.getBoundingClientRect();
    const popW = pop.offsetWidth, popH = pop.offsetHeight;
    let left = rect.left;
    let top = rect.bottom + 8;
    if(left + popW > window.innerWidth - 10) left = window.innerWidth - popW - 10;
    if(top + popH > window.innerHeight - 10) top = rect.top - popH - 8;
    pop.style.left = Math.max(10, left) + 'px';
    pop.style.top = Math.max(10, top) + 'px';
    updateColorPopoverUI();
  });
}

function closeColorPopover(){
  $('color-picker-popover').style.display = 'none';
  colorPopoverTargetKind = null;
  colorPopoverTargetId = null;
}
$('cp-close').addEventListener('click', closeColorPopover);

function commitPopoverColor(){
  if(!colorPopoverTargetId) return;
  updateEntityColor(colorPopoverTargetKind, colorPopoverTargetId, hsvToHex(cpHue, cpSat, cpVal));
}

function bindDrag(el, handler){
  let dragging = false;
  const onMove = (e)=>{ if(dragging) handler(e); };
  const onUp = ()=>{
    if(!dragging) return;
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    commitPopoverColor();
  };
  el.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    dragging = true;
    handler(e);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}
bindDrag($('cp-sv'), (e)=>{
  const rect = $('cp-sv').getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
  const y = Math.min(Math.max(e.clientY - rect.top, 0), rect.height);
  cpSat = (x/rect.width)*100;
  cpVal = 100 - (y/rect.height)*100;
  updateColorPopoverUI();
});
bindDrag($('cp-hue'), (e)=>{
  const rect = $('cp-hue').getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
  cpHue = (x/rect.width)*360;
  updateColorPopoverUI();
});
$('cp-hex').addEventListener('input', ()=>{
  let v = $('cp-hex').value.trim();
  if(v && !v.startsWith('#')) v = '#'+v;
  if(/^#[0-9a-fA-F]{6}$/.test(v)){
    const hsv = hexToHsv(v);
    cpHue = hsv.h; cpSat = hsv.s; cpVal = hsv.v;
    updateColorPopoverUI(true);
  }
});
$('cp-hex').addEventListener('change', ()=>commitPopoverColor());
document.addEventListener('pointerdown', (e)=>{
  const pop = $('color-picker-popover');
  if(pop.style.display !== 'none' && !pop.contains(e.target) && !e.target.closest('[data-open-picker]')){
    closeColorPopover();
  }
}, true);

// ---------- Mode mandiri (localStorage) untuk hosting di luar claude.ai, mis. GitHub Pages ----------
// Saat window.claude tidak tersedia (dbNs/assetsNs/downloadsNs semua null), aplikasi tetap berfungsi
// penuh dengan menyimpan semuanya di localStorage browser ini (tidak tersinkron antar perangkat/rekan).

const LS_KEYS = { bugs:'lwb_bugs', tags:'lwb_tags', modules:'lwb_modules', priorities:'lwb_priorities', images:'lwb_images' };

function lsGet(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ console.error('localStorage penuh atau tidak tersedia', e); }
}
function persistLocalAll(){
  if(dbNs) return;
  lsSet(LS_KEYS.bugs, items);
  lsSet(LS_KEYS.tags, tags);
  lsSet(LS_KEYS.modules, modules);
  lsSet(LS_KEYS.priorities, priorities);
}

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Upload gambar: pakai assets Claude kalau tersedia, kalau tidak simpan sebagai data URI di localStorage
async function uploadImageAny(file){
  const webpFile = await fileToWebp(file);
  if(assetsNs){
    const res = await assetsNs.upload(webpFile);
    return {id: res.id, url: res.url};
  }
  const dataUrl = await fileToDataUrl(webpFile);
  const id = 'local-img-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  const imgs = lsGet(LS_KEYS.images, {});
  imgs[id] = dataUrl;
  lsSet(LS_KEYS.images, imgs);
  return {id, url: dataUrl};
}

function browserDownload(filename, blobOrData){
  const blob = (blobOrData instanceof Blob) ? blobOrData : new Blob([blobOrData]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

$('f-image').addEventListener('change', async (e)=>{

  e.target.value = '';
  if(!files.length) return;
  for(const file of files){

      pendingImages.push({id: res.id, url: res.url});
    }catch(err){ console.error(err); showToast('Gagal mengunggah salah satu gambar.'); }

function imgUrl(id){
  if(typeof id === 'string' && id.startsWith('local-img-')){
    const imgs = lsGet(LS_KEYS.images, {});
    return imgs[id] || '';
  }
  return '/_blob/' + id;
}

// Konversi gambar ke format WebP sebelum diunggah
function fileToWebp(file, quality=0.85){
  return new Promise((resolve)=>{
    if(!file.type || !file.type.startsWith('image/')){ resolve(file); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob((blob)=>{
          URL.revokeObjectURL(url);
          if(!blob){ resolve(file); return; }
          const baseName = (file.name || 'gambar').replace(/\.[^.]+$/, '');
          resolve(new File([blob], baseName + '.webp', {type:'image/webp'}));
        }, 'image/webp', quality);
      }catch(err){
        URL.revokeObjectURL(url);
        resolve(file);
      }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

// Status kini diturunkan dari dua checklist: developer (sudah dikerjakan) & QC (sudah dicek)
function getDeveloped(it){
  if(typeof it.developed === 'boolean') return it.developed;
  return it.status === 'Dalam Proses' || it.status === 'Selesai' || it.status === 'Sudah didevelop' || it.status === 'Sudah dicek';
}
function getCheckedQA(it){
  if(typeof it.checkedQA === 'boolean') return it.checkedQA;
  return it.status === 'Selesai' || it.status === 'Sudah dicek';
}
function deriveStatusLabel(developed, checkedQA){
  if(developed && checkedQA) return 'Sudah dicek';
  if(developed) return 'Sudah didevelop';
  return 'Baru';
}
function statusSlug(label){
  if(label === 'Sudah dicek') return 'checked';
  if(label === 'Sudah didevelop') return 'developed';
  return 'baru';
}

async function toggleFlag(id, field, value){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  const developed = field === 'developed' ? value : getDeveloped(it);
  const checkedQA = field === 'checkedQA' ? value : getCheckedQA(it);
  const status = deriveStatusLabel(developed, checkedQA);
  try{
    if(dbNs){
      await dbNs.doc('bugs/'+id).update({developed, checkedQA, status, updatedAt: Date.now()});
    } else {
      const idx = items.findIndex(i=>i.id===id);
      if(idx>-1){
        items[idx].developed = developed;
        items[idx].checkedQA = checkedQA;
        items[idx].status = status;
        render();
      }
    }
  } catch(err){ console.error(err); }
}

// Terapkan status langsung dari slug kolom kanban (dipakai oleh drag & drop, dan tombol panah lanjut)
async function applyStatusBySlug(id, slug){
  let developed, checkedQA;
  if(slug === 'baru'){ developed=false; checkedQA=false; }
  else if(slug === 'developed'){ developed=true; checkedQA=false; }
  else { developed=true; checkedQA=true; }
  const status = deriveStatusLabel(developed, checkedQA);
  try{
    if(dbNs){
      await dbNs.doc('bugs/'+id).update({developed, checkedQA, status, updatedAt: Date.now()});
    } else {
      const idx = items.findIndex(i=>i.id===id);
      if(idx>-1){ items[idx].developed=developed; items[idx].checkedQA=checkedQA; items[idx].status=status; render(); }
    }
  }catch(err){ console.error(err); }
}

function advanceStage(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  const slug = statusSlug(deriveStatusLabel(getDeveloped(it), getCheckedQA(it)));
  if(slug === 'baru') applyStatusBySlug(id, 'developed');
  else if(slug === 'developed') applyStatusBySlug(id, 'checked');
}

async function deleteItem(id){
  if(!confirm('Hapus catatan masalah ini?')) return;
  try{
    if(dbNs){
      await dbNs.doc('bugs/'+id).delete();
    } else {
      const it = items.find(i=>i.id===id);
      if(it && it.images && it.images.length){
        const imgs = lsGet(LS_KEYS.images, {});
        it.images.forEach(iid=>{ delete imgs[iid]; });
        lsSet(LS_KEYS.images, imgs);
      }
      items = items.filter(i=>i.id!==id);
      render();
    }
  } catch(err){ console.error(err); }
}

function fmtDate(ts){
  if(!ts) return '';
  try{
    return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}

let viewMode = 'list';
let sortMode = 'newest';
let searchQuery = '';
let currentPage = 1;
let pageSize = 10;

function resetPageAndRender(){
  currentPage = 1;
  render();
}

function getFilteredSortedItems(){
  const fm = $('filter-module').value;
  const ft = $('filter-tag').value;
  const fs = $('filter-status').value;
  const fp = $('filter-priority').value;

  let filtered = items.filter(it=>{
    if(fm && it.module !== fm) return false;
    if(ft && !(it.tags||[]).includes(ft)) return false;
    if(fs && deriveStatusLabel(getDeveloped(it), getCheckedQA(it)) !== fs) return false;
    if(fp && it.priority !== fp) return false;
    if(searchQuery){
      const hay = ((it.title||'') + ' ' + (it.description||'')).toLowerCase();
      if(!hay.includes(searchQuery)) return false;
    }
    return true;
  });

  filtered.sort((a,b)=>{
    if(sortMode === 'oldest') return (a.createdAt||0)-(b.createdAt||0);
    if(sortMode === 'priority-desc'){
      return priorityOrderOf(b.priority)-priorityOrderOf(a.priority) || (b.createdAt||0)-(a.createdAt||0);
    }
    if(sortMode === 'priority-asc'){
      return priorityOrderOf(a.priority)-priorityOrderOf(b.priority) || (b.createdAt||0)-(a.createdAt||0);
    }
    if(sortMode === 'stale'){
      const aDone = deriveStatusLabel(getDeveloped(a), getCheckedQA(a)) === 'Sudah dicek' ? 1 : 0;
      const bDone = deriveStatusLabel(getDeveloped(b), getCheckedQA(b)) === 'Sudah dicek' ? 1 : 0;
      if(aDone !== bDone) return aDone - bDone;
      return (a.createdAt||0)-(b.createdAt||0);
    }
    return (b.createdAt||0)-(a.createdAt||0);
  });
  return filtered;
}

function render(){
  persistLocalAll();
  const filtered = getFilteredSortedItems();
  $('status-line').textContent = items.length
    ? `${filtered.length} dari ${items.length} masalah ditampilkan`
    : '';
  if(viewMode === 'kanban'){
    $('list').style.display = 'none';
    $('pagination').style.display = 'none';
    $('kanban-board').style.display = 'flex';
    renderKanban(filtered);
  } else {
    $('kanban-board').style.display = 'none';
    $('list').style.display = 'block';
    renderList(filtered);
  }
}

function renderList(filtered){
  const list = $('list');
  list.innerHTML = '';

  if(!filtered.length){
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = items.length ? 'Tidak ada yang cocok dengan filter.' : 'Belum ada masalah tercatat. Tambahkan di atas.';
    list.appendChild(div);
    $('pagination').style.display = 'none';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;
  const startIdx = (currentPage - 1) * pageSize;
  const pageItems = filtered.slice(startIdx, startIdx + pageSize);

  pageItems.forEach(it=>{
    const el = document.createElement('div');
    el.className = 'list-item';
    const developed = getDeveloped(it);
    const checkedQA = getCheckedQA(it);
    const statusLabel = deriveStatusLabel(developed, checkedQA);
    const tagBadges = (it.tags||[]).map(t=>tagBadgeHtml(t)).join('');
    const imgs = (it.images||[]).map(id=>`<img src="${imgUrl(id)}" data-full="${imgUrl(id)}">`).join('');
    const hasNote = !!(it.devNote || it.qcNote);
    el.innerHTML = `
      <div class="li-top">
        <div>
          <div class="li-title">${escapeHtml(it.title||'')}</div>
          ${it.description ? `<div class="li-desc">${escapeHtml(it.description)}</div>` : ''}
          <div class="badges">
            <span class="badge">${escapeHtml(it.module||'')}</span>
            <span class="badge status-${statusSlug(statusLabel)}">${statusLabel}</span>
            ${tagBadges}
          </div>
          ${imgs ? `<div class="li-images">${imgs}</div>` : ''}
          <div class="meta">Dibuat ${fmtDate(it.createdAt)}${it.updatedAt && it.updatedAt!==it.createdAt ? ' · diubah '+fmtDate(it.updatedAt) : ''}</div>
        </div>
        <div class="li-actions">
          <div class="li-actions-row">${priorityBadgeHtml(it.priority)}</div>
          <div class="li-actions-row">
            <button class="icon-btn" data-del="${it.id}" title="Hapus">🗑️</button>
            <button class="icon-btn" data-edit="${it.id}" title="Edit">✏️</button>
            <button class="icon-btn" data-view="${it.id}" title="Lihat">👁️</button>
          </div>
          <div class="li-actions-row">
            <label class="chk-label"><input type="checkbox" class="dev-check" data-id="${it.id}" ${developed?'checked':''}> Dev</label>
            <label class="chk-label"><input type="checkbox" class="qc-check" data-id="${it.id}" ${checkedQA?'checked':''}> QC</label>
            <button class="icon-btn note-btn${hasNote?' has-note':''}" data-note="${it.id}" title="Catatan Developer & QC">📝</button>
          </div>
        </div>
      </div>
    `;
    list.appendChild(el);
  });

  list.querySelectorAll('.dev-check').forEach(cb=>{
    cb.addEventListener('change', ()=>toggleFlag(cb.dataset.id, 'developed', cb.checked));
  });
  list.querySelectorAll('.qc-check').forEach(cb=>{
    cb.addEventListener('change', ()=>toggleFlag(cb.dataset.id, 'checkedQA', cb.checked));
  });
  list.querySelectorAll('[data-note]').forEach(b=>{
    b.addEventListener('click', ()=>openNoteModal(b.dataset.note));
  });
  list.querySelectorAll('[data-view]').forEach(b=>{
    b.addEventListener('click', ()=>viewItem(b.dataset.view));
  });
  list.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=>editItem(b.dataset.edit));
  });
  list.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>deleteItem(b.dataset.del));
  });
  list.querySelectorAll('.li-images img').forEach(img=>{
    img.addEventListener('click', ()=>openLightbox(img.dataset.full));
  });

  renderPaginationControls(totalPages);
}

function renderPaginationControls(totalPages){
  const el = $('pagination');
  if(totalPages <= 1){ el.style.display = 'none'; el.innerHTML=''; return; }
  el.style.display = 'flex';
  el.innerHTML = `
    <button type="button" class="icon-btn" id="page-prev" ${currentPage<=1?'disabled':''}>← Sebelumnya</button>
    <span class="page-info">Halaman ${currentPage} dari ${totalPages}</span>
    <button type="button" class="icon-btn" id="page-next" ${currentPage>=totalPages?'disabled':''}>Berikutnya →</button>
  `;
  $('page-prev').addEventListener('click', ()=>{
    if(currentPage>1){ currentPage--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  });
  $('page-next').addEventListener('click', ()=>{
    if(currentPage<totalPages){ currentPage++; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  });
}

let dragItemId = null;

function renderKanban(filtered){
  const board = $('kanban-board');
  board.innerHTML = '';
  const cols = [
    {label:'Baru', slug:'baru'},
    {label:'Sudah didevelop', slug:'developed'},
    {label:'Sudah dicek', slug:'checked'}
  ];
  cols.forEach(col=>{
    const colItems = filtered.filter(it=>statusSlug(deriveStatusLabel(getDeveloped(it), getCheckedQA(it))) === col.slug);
    const colEl = document.createElement('div');
    colEl.className = 'kanban-col';
    colEl.dataset.slug = col.slug;
    const head = document.createElement('div');
    head.className = 'kanban-col-head';
    head.innerHTML = `<span>${col.label}</span><span class="kanban-count">${colItems.length}</span>`;
    colEl.appendChild(head);

    if(!colItems.length){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.style.padding = '18px 6px';
      empty.textContent = 'Tidak ada masalah';
      colEl.appendChild(empty);
    }

    colItems.forEach(it=>{
      const tagBadges = (it.tags||[]).slice(0,3).map(t=>tagBadgeHtml(t)).join('');
      const hasNote = !!(it.devNote || it.qcNote);
      const card = document.createElement('div');
      card.className = 'kanban-card';
      card.draggable = true;
      card.dataset.id = it.id;
      card.innerHTML = `
        <div class="kanban-card-title">${escapeHtml(it.title||'')}</div>
        <div class="kanban-card-badges">
          ${priorityBadgeHtml(it.priority)}
          <span class="badge">${escapeHtml(it.module||'')}</span>
          ${tagBadges}
        </div>
        <div class="kanban-card-actions">
          <button class="icon-btn note-btn${hasNote?' has-note':''}" data-note="${it.id}" title="Catatan">📝</button>
          <button class="icon-btn" data-edit="${it.id}" title="Edit">✏️</button>
          ${col.slug !== 'checked' ? `<button class="icon-btn kanban-advance" data-advance="${it.id}" title="Lanjutkan ke tahap berikutnya">➡️</button>` : ''}
        </div>
      `;
      card.addEventListener('click', (e)=>{
        if(e.target.closest('button')) return;
        viewItem(it.id);
      });
      card.querySelector('[data-note]').addEventListener('click', (e)=>{ e.stopPropagation(); openNoteModal(it.id); });
      card.querySelector('[data-edit]').addEventListener('click', (e)=>{ e.stopPropagation(); editItem(it.id); });
      const advBtn = card.querySelector('[data-advance]');
      if(advBtn){ advBtn.addEventListener('click', (e)=>{ e.stopPropagation(); advanceStage(it.id); }); }

      card.addEventListener('dragstart', (e)=>{
        dragItemId = it.id;
        e.dataTransfer.setData('text/plain', it.id);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        dragItemId = null;
      });

      colEl.appendChild(card);
    });

    colEl.addEventListener('dragover', (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      colEl.classList.add('drag-over');
    });
    colEl.addEventListener('dragleave', ()=>{ colEl.classList.remove('drag-over'); });
    colEl.addEventListener('drop', (e)=>{
      e.preventDefault();
      colEl.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain') || dragItemId;
      if(id) applyStatusBySlug(id, col.slug);
    });

    board.appendChild(colEl);
  });
}

let pendingImportRows = [];

function normalizeHeader(h){ return String(h).toLowerCase().trim(); }

function mapImportRow(row){
  const keys = Object.keys(row);
  const get = (...names) => {
    for(const k of keys){
      if(names.includes(normalizeHeader(k))) return row[k];
    }
    return '';
  };
  const title = String(get('judul','judul masalah','title','keterangan')||'').trim();
  if(!title) return null;
  const description = String(get('deskripsi','description','catatan')||'').trim();
  const moduleVal = String(get('modul','module')||'').trim();
  const priorityVal = String(get('prioritas','priority')||'').trim();
  const tagsRaw = String(get('tag','tags','jenis masalah')||'').trim();
  const tagsArr = tagsRaw ? tagsRaw.split(/[,;]/).map(s=>s.trim()).filter(Boolean) : [];
  const devRaw = String(get('developer','dev','developed')||'').trim().toLowerCase();
  const qcRaw = String(get('qc','checked','checkedqa')||'').trim().toLowerCase();
  const statusRaw = String(get('status')||'').trim().toLowerCase();
  const truthy = v => ['true','1','ya','yes','sudah','v','x','✓','done'].includes(v);
  let developed = truthy(devRaw);
  let checkedQA = truthy(qcRaw);
  if(statusRaw.includes('dicek')){ developed = true; checkedQA = true; }
  else if(statusRaw.includes('develop')){ developed = true; }
  return { title, description, module: moduleVal, priority: priorityVal, tags: tagsArr, developed, checkedQA };
}

$('import-btn').addEventListener('click', ()=> $('import-file').click());

$('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(typeof XLSX === 'undefined'){ showToast('Modul import belum siap, coba lagi sesaat.'); return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheetName = wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      const mapped = rows.map(mapImportRow).filter(Boolean);
      pendingImportRows = mapped;
      showImportPreview(mapped, sheetName);
    }catch(err){
      console.error(err);
      showToast('Gagal membaca file. Pastikan formatnya .csv atau .xlsx.');
    }
  };
  reader.readAsArrayBuffer(file);
});

function showImportPreview(rows, sheetName){
  const wrap = $('import-summary');
  if(!rows.length){
    wrap.innerHTML = `<p style="color:var(--muted); font-size:0.85rem;">Tidak ada baris yang bisa dibaca. Pastikan ada kolom "Judul" atau "Keterangan".</p>`;
    $('import-confirm-btn').style.display = 'none';
  } else {
    const sample = rows.slice(0,5).map(r=>`<li>${escapeHtml(r.title)}</li>`).join('');
    wrap.innerHTML = `
      <p style="font-size:0.88rem;">Ditemukan <strong>${rows.length}</strong> baris dari sheet "${escapeHtml(sheetName)}" siap diimpor sebagai masalah baru.</p>
      <p style="color:var(--muted); font-size:0.8rem; margin-top:10px;">Contoh:</p>
      <ul style="margin:4px 0 10px 18px; padding:0; font-size:0.83rem;">${sample}</ul>
      <p style="color:var(--muted); font-size:0.76rem;">Modul, prioritas, dan tag yang belum ada di sistem akan otomatis dibuat.</p>
    `;

  }

}

async function ensureModuleExists(name){
  if(!name || modules.some(m=>m.name===name)) return;
  if(dbNs){ await dbNs.collection('modules').doc().set({name}); }
  else { modules.push({id:'local-module-'+Date.now()+Math.random(), name}); }
}
async function ensurePriorityExists(name){
  if(!name || priorities.some(p=>p.name===name)) return;
  const order = priorities.length ? Math.max(...priorities.map(p=>p.order||0))+1 : 0;
  const color = TAG_PALETTE[priorities.length % TAG_PALETTE.length];
  if(dbNs){ await dbNs.collection('priorities').doc().set({name, color, order}); }
  else { priorities.push({id:'local-priority-'+Date.now()+Math.random(), name, color, order}); }
}
async function ensureTagExists(name){
  if(!name || tags.some(t=>t.name===name)) return;
  const color = TAG_PALETTE[tags.length % TAG_PALETTE.length];
  if(dbNs){ await dbNs.collection('tags').doc().set({name, color}); }
  else { tags.push({id:'local-tag-'+Date.now()+Math.random(), name, color}); }
}

async function confirmImport(){
  const rows = pendingImportRows;
  if(!rows.length) return;
  $('import-confirm-btn').disabled = true;
  try{
    const defaultModuleName = modules[0] ? modules[0].name : 'Lainnya';
    const sortedP = [...priorities].sort((a,b)=>(a.order||0)-(b.order||0));
    const defaultPriorityName = sortedP[Math.min(1, sortedP.length-1)] ? sortedP[Math.min(1, sortedP.length-1)].name : 'Sedang';

    for(const r of rows){
      const moduleName = r.module || defaultModuleName;
      const priorityName = r.priority || defaultPriorityName;
      await ensureModuleExists(moduleName);
      await ensurePriorityExists(priorityName);
      for(const t of r.tags){ await ensureTagExists(t); }
      const status = deriveStatusLabel(r.developed, r.checkedQA);
      const doc = {
        title: r.title, description: r.description, module: moduleName, priority: priorityName,
        tags: r.tags, images: [], developed: r.developed, checkedQA: r.checkedQA, status,
        createdAt: Date.now(), updatedAt: Date.now()
      };
      if(dbNs){ await dbNs.collection('bugs').doc().set(doc); }
      else { items.unshift({id:'local-'+Date.now()+Math.random(), ...doc}); }
    }
    if(!dbNs){
      renderModuleOptions(); renderPriorityOptions();
      renderTagChoices(); renderEdTagChoices(); renderTagFilterOptions();
      renderAllManagers();
    }
    const count = rows.length;
    pendingImportRows = [];
    closeModal('import-modal');
    render();
    showToast(`Import selesai: ${count} masalah ditambahkan.`);
  }catch(err){
    console.error(err);
    showToast('Terjadi kesalahan saat mengimpor.');
  }
  $('import-confirm-btn').disabled = false;
}

let downloadsNsCache;
async function getDownloadsNs(){
  if(downloadsNsCache !== undefined) return downloadsNsCache;
  try{
    downloadsNsCache = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
  }catch(e){ downloadsNsCache = null; }
  return downloadsNsCache;
}

function buildExportRows(){
  return getFilteredSortedItems().map(it=>{
    const developed = getDeveloped(it);
    const checkedQA = getCheckedQA(it);
    return {
      'Judul': it.title || '',
      'Deskripsi': it.description || '',
      'Modul': it.module || '',
      'Prioritas': it.priority || '',
      'Tag': (it.tags||[]).join(', '),
      'Status': deriveStatusLabel(developed, checkedQA),
      'Developer': developed ? 'Ya' : 'Tidak',
      'QC': checkedQA ? 'Ya' : 'Tidak',
      'Catatan Developer': it.devNote || '',
      'Catatan QC': it.qcNote || '',
      'Dibuat': fmtDate(it.createdAt),
      'Diubah': fmtDate(it.updatedAt)
    };
  });
}

async function exportCsv(){
  if(typeof XLSX === 'undefined'){ showToast('Modul ekspor belum siap, coba lagi sesaat.'); return; }
  const rows = buildExportRows();
  if(!rows.length){ showToast('Tidak ada data untuk diekspor.'); return; }
  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    const csv = XLSX.utils.sheet_to_csv(ws);
    const dl = await getDownloadsNs();
    if(dl){ await dl.save({filename:'lwb-bug-tracker.csv', data: csv}); }
    else { browserDownload('lwb-bug-tracker.csv', new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'})); }
    showToast('CSV berhasil diunduh.');
  }catch(err){ console.error(err); showToast('Gagal mengunduh CSV.'); }
}

async function exportXlsx(){
  if(typeof XLSX === 'undefined'){ showToast('Modul ekspor belum siap, coba lagi sesaat.'); return; }
  const rows = buildExportRows();
  if(!rows.length){ showToast('Tidak ada data untuk diekspor.'); return; }
  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Bug Tracker');
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/octet-stream'});
    const dl = await getDownloadsNs();
    if(dl){ await dl.save({filename:'lwb-bug-tracker.xlsx', data: blob}); }
    else { browserDownload('lwb-bug-tracker.xlsx', blob); }
    showToast('Excel berhasil diunduh.');
  }catch(err){ console.error(err); showToast('Gagal mengunduh Excel.'); }
}

async function exportPdf(){
  if(typeof window.jspdf === 'undefined'){ showToast('Modul PDF belum siap, coba lagi sesaat.'); return; }
  const rows = buildExportRows();
  if(!rows.length){ showToast('Tidak ada data untuk diekspor.'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});

      body: rows.map(r=>[r['Judul'], r['Modul'], r['Prioritas'], r['Status'], r['Developer'], r['QC'], r['Tag']]),
      startY: 60,
      styles:{ fontSize:8, cellPadding:4, overflow:'linebreak' },
      columnStyles:{ 0:{cellWidth:230} },
      headStyles:{ fillColor:[138,109,59], textColor:255 },

    else { browserDownload('lwb-bug-tracker.pdf', blob); }
    showToast('PDF berhasil diunduh.');
  }catch(err){ console.error(err); showToast('Gagal membuat PDF.'); }
}

async function seedTagsIfEmpty(){
  if(!dbNs || tags.length > 0) return;
  try{
    for(let i=0;i<DEFAULT_TAGS.length;i++){
      await dbNs.collection('tags').doc().set({name: DEFAULT_TAGS[i], color: TAG_PALETTE[i % TAG_PALETTE.length]});
    }
  }catch(err){ console.error('seed tags error', err); }
}

async function seedModulesIfEmpty(){
  if(!dbNs || modules.length > 0) return;
  try{
    for(const name of DEFAULT_MODULES){
      await dbNs.collection('modules').doc().set({name});
    }
  }catch(err){ console.error('seed modules error', err); }
}

async function seedPrioritiesIfEmpty(){
  if(!dbNs || priorities.length > 0) return;
  try{
    for(let i=0;i<DEFAULT_PRIORITIES.length;i++){
      await dbNs.collection('priorities').doc().set({name: DEFAULT_PRIORITIES[i].name, color: DEFAULT_PRIORITIES[i].color, order: i});
    }
  }catch(err){ console.error('seed priorities error', err); }
}

// Migrasi satu kali: hapus 5 item placeholder generik lama, masukkan 22 masalah nyata dari QC_Tracker_LWB.xlsx
async function migrateToQcTrackerData(){
  if(!dbNs) return;
  try{
    const already = await dbNs.doc('meta/qcSeedV1').get();
    if(already && already.exists) return;
  }catch(e){ /* doc belum ada -- lanjut */ }

  try{
    const toRemove = items.filter(it => OLD_PLACEHOLDER_TITLES.includes(it.title));
    for(const it of toRemove){
      await dbNs.doc('bugs/'+it.id).delete();
    }
    const alreadyTitles = new Set(items.map(it=>it.title));
    for(const seed of QC_SEED_ITEMS){
      if(alreadyTitles.has(seed.title)) continue; // hindari duplikat kalau migrasi terpicu dua kali
      await dbNs.collection('bugs').doc().set({
        title: seed.title,
        description: seed.description,
        module: seed.module,
        priority: seed.priority,
        tags: seed.tags,
        images: [],
        status: seed.status,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
    }
    await dbNs.doc('meta/qcSeedV1').set({done:true, at: Date.now()});
  }catch(err){ console.error('migrate error', err); }
}

// Migrasi satu kali: masukkan seluruh 164 item dari sheet "Evaluasi Hasil Sosialisasi"
// (Google Sheet "Report Website LWB"). Item #1-19 sudah dipastikan Developed=TRUE & Checked=TRUE
// dari sumber; item #20-164 statusnya belum bisa dipastikan otomatis (lihat tag "Status Perlu Diverifikasi").
async function migrateEvalHasilSosialisasi(){
  if(!dbNs) return;
  try{
    const already = await dbNs.doc('meta/evalSeedV1').get();
    if(already && already.exists) return;
  }catch(e){ /* doc belum ada -- lanjut */ }

  try{
    // pastikan modul "Lainnya" ada
    if(!modules.some(m=>m.name==='Lainnya')){
      await dbNs.collection('modules').doc().set({name:'Lainnya'});
    }
    // pastikan tag "Status Perlu Diverifikasi" ada
    if(!tags.some(t=>t.name==='Status Perlu Diverifikasi')){
      await dbNs.collection('tags').doc().set({name:'Status Perlu Diverifikasi', color:'#8a5fbf'});
    }

    const alreadyTitles = new Set(items.map(it=>it.title));
    for(const seed of EVAL_SEED_ITEMS){
      if(alreadyTitles.has(seed.title)) continue; // hindari duplikat kalau migrasi terpicu dua kali
      await dbNs.collection('bugs').doc().set({
        title: seed.title,
        description: seed.description,
        module: seed.module,
        priority: seed.priority,
        tags: seed.tags,
        images: [],
        developed: seed.developed,
        checkedQA: seed.checkedQA,
        status: seed.status,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
    }
    await dbNs.doc('meta/evalSeedV1').set({done:true, at: Date.now()});
  }catch(err){ console.error('migrate eval error', err); }
}

async function init(){
  try{
    if(window.claude && window.claude.use){
      dbNs = await window.claude.use('db');
      assetsNs = await window.claude.use('assets');
    }
  }catch(e){ console.error(e); }

  if(dbNs){
    let tagsLoaded = false, modulesLoaded = false, prioritiesLoaded = false, itemsLoaded = false;
    let migrated = false;
    const maybeSeed = async ()=>{
      if(tagsLoaded && modulesLoaded && prioritiesLoaded && itemsLoaded && !migrated){
        migrated = true;
        await seedTagsIfEmpty();
        await seedModulesIfEmpty();
        await seedPrioritiesIfEmpty();
        await migrateToQcTrackerData();
        await migrateEvalHasilSosialisasi();
      }
    };
    try{
      dbNs.collection('tags').onSnapshot((snap)=>{
        tags = snap.docs.map(d=>({id:d.id, ...d.data()}));
        tagsLoaded = true;
        renderTagChoices(); renderEdTagChoices(); renderTagFilterOptions(); renderAllManagers();
        maybeSeed();
      });
      dbNs.collection('modules').onSnapshot((snap)=>{
        modules = snap.docs.map(d=>({id:d.id, ...d.data()}));
        modulesLoaded = true;
        renderModuleOptions(); renderAllManagers();
        maybeSeed();
      });
      dbNs.collection('priorities').onSnapshot((snap)=>{
        priorities = snap.docs.map(d=>({id:d.id, ...d.data()}));
        prioritiesLoaded = true;
        renderPriorityOptions(); renderAllManagers();
        maybeSeed();
        render();
      });
      dbNs.collection('bugs').onSnapshot((snap)=>{
        items = snap.docs.map(d=>({id:d.id, ...d.data()}));
        itemsLoaded = true;
        $('status-line').textContent = '';
        render();
        maybeSeed();
      });
    }catch(e){
      console.error(e);
      $('status-line').textContent = 'Gagal memuat data tersimpan.';
      renderTagChoices(); renderAllManagers();
      render();
    }
  } else {
    items = lsGet(LS_KEYS.bugs, []);
    tags = lsGet(LS_KEYS.tags, null) || DEFAULT_TAGS.map((name,i)=>({id:'local-tag-'+i, name, color: TAG_PALETTE[i % TAG_PALETTE.length]}));
    modules = lsGet(LS_KEYS.modules, null) || DEFAULT_MODULES.map((name,i)=>({id:'local-module-'+i, name}));
    priorities = lsGet(LS_KEYS.priorities, null) || DEFAULT_PRIORITIES.map((p,i)=>({id:'local-priority-'+i, name:p.name, color:p.color, order:i}));
    renderTagChoices(); renderEdTagChoices(); renderTagFilterOptions();
    renderModuleOptions(); renderPriorityOptions(); renderAllManagers();
    const banner = $('mode-banner');
    banner.style.display = 'block';
    banner.textContent = '🔒 Mode mandiri: data (termasuk gambar) tersimpan di browser ini saja, tidak tersinkron ke perangkat/rekan lain.';
    render();
  }
}
init();
</script>
